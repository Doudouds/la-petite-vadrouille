        stationLayer.clearLayers();

        if (map.getZoom() < 9) {
          updateStatusWithStations(0, true);
          return;
        }

        let visibleStationCount = 0;
        stationRecords.forEach(record => {
          if (bounds.contains(record.latlng)) {
            record.marker.addTo(stationLayer);
            visibleStationCount++;
          }
        });

        updateStatusWithStations(visibleStationCount);
      }

      function scheduleStationLoad() {
        if (stationLoadTimer !== null) {
          window.clearTimeout(stationLoadTimer);
        }
        stationLoadTimer = window.setTimeout(loadStationsForView, 80);
      }

      map.on('zoomstart', () => {
        kmLayer.clearLayers();
        stationLayer.clearLayers();
        hideKmHoverTooltip();
        map.closePopup(routeContextPopup);
      });
      map.on('mousemove', updateKmHoverTooltip);
      map.on('mouseout', hideKmHoverTooltip);
      map.on('zoomend', scheduleKmRender);
      map.on('zoomend', scheduleStationLoad);
      map.on('moveend', scheduleKmRender);
      map.on('moveend', scheduleStationLoad);
      if (plannerState.routeContextHandler) {
        map.off('contextmenu', plannerState.routeContextHandler);
      }
      plannerState.routeContextHandler = handleRouteContextMenu;
      map.on('contextmenu', plannerState.routeContextHandler);
      if (plannerState.mapPickHandler) {
        map.off('click', plannerState.mapPickHandler);
      }

      plannerState.mapPickHandler = event => {
        if (!plannerState.mapPickRole || !plannerState.routeGeometry) {
          return;
        }

        const snapped = nearestRoutePosition([event.latlng.lat, event.latlng.lng], plannerState.routeGeometry);
        if (!snapped.latlng) {
          return;
        }

        applyMapPickSelection(snapped.meters, snapped.latlng);
      };
      map.on('click', plannerState.mapPickHandler);
      renderVisibleKmMarkers();
      updateStatusWithStations(0, map.getZoom() < 9);
      scheduleStationLoad();
      renderPlanner();
      updateSelectionOverlay();
    }

    function drawCachedData(data) {
      const displayRoute = filterDisplayedRouteSegments(
        Array.isArray(data?.segments) ? data.segments : [],
        Array.isArray(data?.segmentPointMeters) ? data.segmentPointMeters : null
      );
      updatePlannerCities(adjustDisplayedCities(data?.cities, displayRoute));
      drawResolvedSegments({
        segments: Array.isArray(data?.segments) ? data.segments : [],
        segmentPointMeters: Array.isArray(data?.segmentPointMeters) ? data.segmentPointMeters : null,
        maxJoinGap: Number(data?.maxJoinGap) || 0,
        chainCount: Number(data?.chainCount) || 0,
        rawSegmentCount: Number(data?.rawSegmentCount) || (Array.isArray(data?.segments) ? data.segments.length : 0),
        totalKm: typeof data?.totalKm === 'number' ? data.totalKm : null
      });
    }

    function readStoredRouteCache() {
      if (!routeCacheEntry || typeof localStorage === 'undefined') {
        return null;
      }

      try {
        const raw = localStorage.getItem(`gr-route-cache:${refKey}`);
        if (!raw) {
          return null;
        }

        const parsed = JSON.parse(raw);
        const isCurrentVersion = parsed?.generatedAt === routeCacheManifest.generatedAt;
        const hasRequiredData = Array.isArray(parsed?.cities) && Array.isArray(parsed?.segments);
        if (isCurrentVersion && hasRequiredData) {
          return parsed;
        }

        localStorage.removeItem(`gr-route-cache:${refKey}`);
        return null;
      } catch {
        return null;
      }
    }

    function storeRouteCache(data) {
      if (typeof localStorage === 'undefined') {
        return;
      }

      try {
        localStorage.setItem(`gr-route-cache:${refKey}`, JSON.stringify(data));
      } catch {
        // Ignore storage quota issues; the local JSON file remains the source of truth.
      }
    }

    async function resolveRouteData() {
      const stored = readStoredRouteCache();
      if (stored) {
        return stored;
      }

      if (!routeCacheEntry) {
        const unresolved = routeCacheManifest.unresolved?.[refKey];
        throw new Error(
          unresolved
            ? `Tracé non disponible dans le cache local : ${unresolved}`
            : `Aucun cache local disponible pour ${refKey}.`
        );
      }

      const cacheFile = routeCacheEntry.file;
      const cacheVersion = routeCacheManifest.generatedAt || 'local';
      const response = await fetch(`${cacheFile}?v=${encodeURIComponent(cacheVersion)}`);
      if (!response.ok) {
        const unresolved = routeCacheManifest.unresolved?.[refKey];
        throw new Error(
          unresolved
            ? `Tracé non disponible dans le cache local : ${unresolved}`
            : `Impossible de lire le cache local (${response.status}).`
        );
      }

      const data = await response.json();
      const normalizedData = {
        ...data,
        generatedAt: routeCacheManifest.generatedAt || data.generatedAt || new Date().toISOString()
      };
      storeRouteCache(normalizedData);
      return normalizedData;
    }

    startInput.addEventListener('input', event => {
      plannerState.startQuery = event.target.value;
      clearSelection('start');
      renderPlanner();
    });

    endInput.addEventListener('input', event => {
      plannerState.endQuery = event.target.value;
      clearSelection('end');
      renderPlanner();
    });

    daysInput.addEventListener('input', event => {
      plannerState.days = event.target.value;
      renderPlanner();
    });

    routePlannerToggle?.addEventListener('click', () => {
      updateRoutePlannerVisibility(!plannerState.plannerOpen);
    });

    routePlannerClose?.addEventListener('click', () => {
      updateRoutePlannerVisibility(false);
    });

    routePlanner.addEventListener('click', event => {
      const actionButton = event.target.closest('[data-action]');
      if (actionButton) {
        const role = actionButton.dataset.role;
        const action = actionButton.dataset.action;
        if (action === 'pick-map') {
          plannerState.mapPickRole = plannerState.mapPickRole === role ? null : role;
          renderPlanner();
          return;
        }

        if (action === 'clear-selection') {
          clearSelection(role, true);
          renderPlanner();
          return;
        }
      }

      const button = event.target.closest('.city-choice');
      if (!button) {
        return;
      }

      const role = button.dataset.role;
      const cityIndex = Number.parseInt(button.dataset.cityIndex || '', 10);
      const city = plannerState.cities[cityIndex];
      if (!city) {
        return;
      }

      if (role === 'start') {
        plannerState.startQuery = city.name;
        startInput.value = city.name;
        setSelection(role, buildSelectionFromCity(role, cityIndex));
      } else {
        plannerState.endQuery = city.name;
        endInput.value = city.name;
        setSelection(role, buildSelectionFromCity(role, cityIndex));
      }

      plannerState.mapPickRole = null;

      renderPlanner();
    });

    resolveRouteData()
      .then(data => {
        updateRouteTitle(routeMeta.displayName || routeCacheEntry?.displayName || data?.displayName || nom);
        drawCachedData(data);
      })
      .catch(err => {
        console.error(err);
        status.textContent = 'Erreur lors du chargement du tracé : ' + err.message;
        status.classList.add('error');
      });
  </script>
</body>
